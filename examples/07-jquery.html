<!doctype html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>07 搭配 jQuery - ERPEditor</title>
    <link rel="stylesheet" href="examples.css">
    <link rel="stylesheet" href="../dist/erp-editor.min.css">
</head>
<body>
    <a class="back" href="index.html">← 範例列表</a>
    <h1>07 搭配 jQuery 與 AJAX</h1>
    <p class="lead">ERPEditor 不需要 jQuery，但可以直接收 jQuery 物件，與 <code>$form.serialize()</code> 一起用。</p>

    <form id="bbs_form">
        <label for="bbs_title">標題</label>
        <input type="text" id="bbs_title" name="bbs_title" value="測試公告">
        <!-- 送出用的隱藏欄位 -->
        <input type="hidden" name="bbs_content">
        <label>內容</label>
        <div id="bbs_editor"></div>
        <div class="row">
            <button type="button" class="demo primary" id="btn-save">儲存</button>
        </div>
    </form>
    <p><code>$form.serialize()</code> 的結果（示範用，未真的送出）：</p>
    <pre class="out" id="out"></pre>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="../dist/erp-editor.min.js"></script>
    <script>
        var $form = $('#bbs_form');
        var editor = ERPEditor.create($('#bbs_editor'), { height: 200, placeholder: '公告內容' });

        // 舊程式的寫法 ERP_editor('#id') 也可以用（全域別名）
        console.log(ERP_editor('#bbs_editor') === editor);   // true

        $('#btn-save').on('click', function () {
            if (editor.isEmpty()) { alert('請輸入內容'); return; }

            // 送出前把 HTML 放進隱藏欄位，serialize() 才會帶到
            $form.find("[name='bbs_content']").val(editor.getHTML());

            $('#out').text(decodeURIComponent($form.serialize().replace(/\+/g, ' ')));

            /* 實際送出：
            $.ajax({
                url: '/ajax/create_new_bbs.php',
                type: 'POST',
                dataType: 'json',
                data: $form.serialize(),
                success: function (data) { ... }
            });
            */
        });
    </script>
</body>
</html>
