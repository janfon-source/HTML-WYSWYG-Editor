<!doctype html>
<html lang="zh-Hant-TW" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>06 Bootstrap modal - ERPEditor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../dist/erp-editor.min.css">
</head>
<body class="p-4">
    <div class="container" style="max-width: 900px">
        <a href="index.html" class="small">← 範例列表</a>
        <h1 class="h3 mt-2">06 在 Bootstrap 5 modal 中使用</h1>
        <p class="text-secondary">有載入 Bootstrap 5.3 時，編輯器自動沿用 <code>--bs-*</code> 顏色，切換 <code>data-bs-theme</code> 就是深色模式。</p>

        <div class="d-flex gap-2 mb-3">
            <button class="btn btn-primary" id="btn-new">新增公告</button>
            <button class="btn btn-outline-secondary" id="btn-theme">切換深色／淺色</button>
        </div>

        <table class="table">
            <thead><tr><th>標題</th><th>內容</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <div class="modal fade" id="post-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">新增公告</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <form id="post-form">
                        <input type="hidden" name="id">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="post-title" name="title" placeholder="標題">
                            <label for="post-title">標題</label>
                        </div>
                        <div id="post-content"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="btn-save">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../dist/erp-editor.min.js"></script>
    <script>
        var posts = [
            { id: 1, title: '系統維護公告', content: '<p>本週六 <b>22:00</b> 起維護兩小時。</p>' },
            { id: 2, title: '年終聚餐', content: '<p>地點：<span style="color: #e03131">台北喜來登</span></p><ul><li>12/20 18:30</li></ul>' }
        ];

        var modalEl = document.getElementById('post-modal');
        var modal = new bootstrap.Modal(modalEl);
        var form = document.getElementById('post-form');

        // 重點 1：編輯器只建立一次；每次開 modal 用 setHTML / clear 換內容
        var editor = ERPEditor.create('#post-content', {
            placeholder: '請輸入公告內容',
            height: 260,
            maxHeight: 500
        });

        function openModal(post) {
            form.reset();
            form.elements.id.value = post ? post.id : '';
            form.elements.title.value = post ? post.title : '';
            document.getElementById('modal-title').textContent = post ? '編輯公告' : '新增公告';
            if (post) editor.setHTML(post.content, true); else editor.clear();
            modal.show();
        }

        // 重點 2：modal 動畫結束後再 focus，否則 Bootstrap 會把焦點搶回 modal
        modalEl.addEventListener('shown.bs.modal', function () {
            form.elements.title.value ? editor.focus() : form.elements.title.focus();
        });

        document.getElementById('btn-save').addEventListener('click', function () {
            var title = form.elements.title.value.trim();
            if (!title || editor.isEmpty()) { alert('標題與內容都要填寫'); return; }
            var id = parseInt(form.elements.id.value, 10);
            var post = posts.find(function (p) { return p.id === id; });
            if (post) { post.title = title; post.content = editor.getHTML(); }
            else posts.push({ id: Date.now(), title: title, content: editor.getHTML() });
            render();
            modal.hide();
        });

        function render() {
            var tbody = document.getElementById('rows');
            tbody.innerHTML = '';
            posts.forEach(function (p) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td></td><td class="erp-editor-content"></td><td><button class="btn btn-sm btn-outline-primary">編輯</button></td>';
                tr.cells[0].textContent = p.title;
                tr.cells[1].innerHTML = ERPEditor.sanitize(p.content);   // 顯示前再過濾一次，資料可能來自其他地方
                tr.querySelector('button').addEventListener('click', function () { openModal(p); });
                tbody.appendChild(tr);
            });
        }
        render();

        document.getElementById('btn-new').addEventListener('click', function () { openModal(null); });
        document.getElementById('btn-theme').addEventListener('click', function () {
            var html = document.documentElement;
            html.setAttribute('data-bs-theme', html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
